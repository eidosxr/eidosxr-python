name: Publish to PyPI

# Publishes eidosxr to PyPI when a version tag (v0.12.0, v1.2.3, ...) is pushed.
# Uses PyPI Trusted Publishing (OIDC) — no API token/secret is stored.
#
# The package version comes from eidosxr/version.py (dynamic attr), NOT from the
# tag, so the tag must match it: tagging v0.12.1 while version.py still says
# 0.12.0 stops here rather than publishing the wrong version. version.py is
# maintained by hand. To release, bump it, merge, then push the matching tag:
#
#   git tag v0.12.0 && git push origin v0.12.0
#
# Creating a GitHub Release for a new tag pushes that tag, so it publishes too.
on:
  push:
    tags: ['v*.*.*']

jobs:
  # Runs first, outside the pypi environment, so a mismatched tag fails in
  # seconds instead of after the test matrix and any environment approval.
  check-version:
    name: Check the tag matches the package version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' eidosxr/version.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match eidosxr/version.py ($version)"
            exit 1
          fi
          echo "Publishing eidosxr $version"

  test:
    needs: check-version
    uses: ./.github/workflows/test.yml

  publish:
    name: Build and publish
    needs: [check-version, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/eidosxr/
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          enable-cache: false # never build a release from a restored cache

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
